site_name: QFT Tutorial
site_description: Tutorial completo sobre Teoría Cuántica de Campos
docs_dir: docs
site_dir: site
exclude_docs: |
  Tutorial/template_modulo.md
  Tutorial/_borradores/**
  Imagenes/diagramas/*.md
not_in_nav: |
  LICENSE.md
  bitacora.md
  changelog.md
  Cuadernos/*
  Imagenes/*
  Notas/*
  Tutorial/portada_*.md
  Tutorial/*/[0-9]*.md
  Tutorial/99_apendices/README.md
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: cyan
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - Inicio: README.md
  - Tutorial:
    - Índice: Tutorial/README.md
    - Cómo Estudiarlo: Tutorial/como_estudiar_este_tutorial.md
    - Problemas por Semana: Tutorial/problemas_recomendados_por_semana.md
    - Rutas de Lectura: Tutorial/rutas_de_lectura.md
    - Tabla Maestra: Tutorial/tabla_maestra_del_tutorial.md
    - Síntesis por Módulo: Tutorial/sintesis_por_modulo.md
    - Catálogo de Capítulos: Tutorial/catalogo_de_capitulos_y_etiquetas.md
    - Mapa de Dependencias: Tutorial/mapa_de_dependencias_conceptuales.md
    - 00. Prerrequisitos: Tutorial/00_prerrequisitos/README.md
    - 01. Fundamentos: Tutorial/01_fundamentos_conceptuales/README.md
    - 02. Relatividad y Campos: Tutorial/02_relatividad_y_campos/README.md
    - 03. Acción y Simetrías: Tutorial/03_accion_y_simetrias/README.md
    - 04. Campo Escalar: Tutorial/04_cuantizacion_del_campo_escalar/README.md
    - 05. Interacciones: Tutorial/05_interacciones_y_perturbaciones/README.md
    - 06. Fermiones: Tutorial/06_fermiones_y_dirac/README.md
    - 07. Gauge y QED: Tutorial/07_gauge_y_qed/README.md
    - 08. Integral de Camino: Tutorial/08_integral_de_camino/README.md
    - 09. Renormalización: Tutorial/09_renormalizacion/README.md
    - 10. Modelo Estándar: Tutorial/10_modelo_estandar/README.md
    - 11. QFT e Información: Tutorial/11_qft_informacion_y_agujeros_negros/README.md
    - 12. Teorías de Campo Efectivas: Tutorial/12_teorias_de_campo_efectivas/README.md
  - Apéndices:
    - Bibliografía: Tutorial/99_apendices/bibliografia.md
    - Herramientas Computacionales: Tutorial/99_apendices/computacion_qft.md
    - Errores Comunes y Recetas: Tutorial/99_apendices/errores_comunes_y_recetas_practicas.md
    - Reglas de Feynman y Propagadores: Tutorial/99_apendices/reglas_de_feynman_y_propagadores.md
    - Simetrías Discretas, CPT y Anomalías: Tutorial/99_apendices/simetrias_discretas_cpt_y_anomalias.md
    - Mezcla de Sabor, CKM y PMNS: Tutorial/99_apendices/mezcla_de_sabor_ckm_y_pmns.md
    - Anomalía Axial y Cancelación de Anomalías: Tutorial/99_apendices/anomalia_axial_y_cancelacion_de_anomalias.md
    - Glosario de Notación: Tutorial/99_apendices/glosario_notacion.md
    - Convenciones Globales: Tutorial/99_apendices/convenciones_globales.md
    - Plantilla Editorial: Tutorial/99_apendices/plantilla_de_capitulo.md

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js
